services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: xnotes
      POSTGRES_PASSWORD: "Cm6FKBgbN2_phsKuihzgNtyvW9kQOF4E"
    volumes:
      - xnotes_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "tVMWoDrY8n-chZ2JXI_0ubo55NwRSs8M"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: xnotes_test
      POSTGRES_PASSWORD: "9P0l183bXImzkpWuXRgtjRCgrXJ3_GLY"
    volumes:
      - xnotes_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "x-Mcq14duIQRe9bk2aSonWeSOTFVdlzu"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  xnotes_data:
  xnotes_test_data:
